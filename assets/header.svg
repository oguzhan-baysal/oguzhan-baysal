<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Oğuzhan Baysal — solo builder. Systems, contracts, backend, ops. Adana, Türkiye.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d0a"/>
      <stop offset="0.55" stop-color="#020705"/>
      <stop offset="1" stop-color="#04100b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#10b981" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="typing">
      <rect class="typer" x="48" y="88" width="190" height="26"/>
    </clipPath>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="10"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .dim  { fill: #10b981; fill-opacity: 0.62; font-size: 14px; letter-spacing: 1px; }
      .body { fill: #6ee7b7; font-size: 16px; letter-spacing: 0.5px; }
      .name { fill: #ecfdf5; font-size: 56px; font-weight: 700; letter-spacing: 2px; }
      .role { fill: #34d399; fill-opacity: 0.9; font-size: 14px; letter-spacing: 5.4px; }
      .foot { fill: #10b981; fill-opacity: 0.7; font-size: 12.5px; letter-spacing: 1.6px; }
      .typer  { transform-origin: 48px 0; transform: scaleX(0); animation: type 2.2s steps(19, end) 0.9s both; }
      .caret  { transform-origin: 0 0; transform: translateX(0); animation: caret 2.2s steps(19, end) 0.9s both, blink 1.05s steps(1, end) 3.2s infinite; }
      .dot    { animation: pulse 2.4s ease-in-out infinite; }
      .scan   { animation: scan 7.5s linear infinite; }
      .bar    { transform-origin: 48px 0; transform: scaleX(0); animation: draw 1.4s ease-out 0.35s both; }
      @keyframes type  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes caret { from { transform: translateX(0); } to { transform: translateX(188px); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.28; } }
      @keyframes scan  { from { transform: translateY(-90px); } to { transform: translateY(390px); } }
      @keyframes draw  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <ellipse cx="240" cy="190" rx="520" ry="230" fill="url(#halo)"/>

    <!-- window chrome -->
    <rect width="1200" height="38" fill="#10b981" fill-opacity="0.05"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#10b981" stroke-opacity="0.18"/>
    <g fill-opacity="0.85">
      <circle cx="26" cy="19" r="5" fill="#ff5f57"/>
      <circle cx="48" cy="19" r="5" fill="#febc2e"/>
      <circle cx="70" cy="19" r="5" fill="#28c840"/>
    </g>
    <text class="mono dim" x="94" y="24" fill-opacity="0.5">oguzhan@github: ~/identity</text>

    <!-- terminal lines -->
    <text class="mono dim" x="48" y="80">$ tail -f principles.log</text>
    <g clip-path="url(#typing)">
      <text class="mono body" x="48" y="108">verify, don't claim</text>
    </g>
    <rect class="caret" x="48" y="90" width="9" height="21" fill="#34d399"/>

    <!-- identity -->
    <text class="mono name" x="48" y="180">O&#286;UZHAN BAYSAL</text>
    <text class="mono role" x="50" y="214">SOLO BUILDER · SYSTEMS · CONTRACTS · BACKEND · OPS</text>

    <g transform="translate(48, 236)">
      <rect class="bar" width="1104" height="1" fill="#10b981" fill-opacity="0.22"/>
    </g>

    <!-- status row -->
    <circle class="dot" cx="54" cy="266" r="4" fill="#34d399"/>
    <text class="mono foot" x="70" y="272">ONLINE 24/7 · SELF-HOSTED</text>
    <text class="mono foot" x="430" y="272" fill-opacity="0.5">ADANA · TÜRKİYE</text>
    <text class="mono foot" x="1152" y="272" text-anchor="end" fill-opacity="0.5">github.com/oguzhan-baysal</text>

    <!-- corner brackets -->
    <g stroke="#10b981" stroke-opacity="0.32" stroke-width="2" fill="none">
      <path d="M22 66V52h16"/>
      <path d="M1178 66V52h-16"/>
      <path d="M22 276v14h16"/>
      <path d="M1178 276v14h-16"/>
    </g>

    <rect class="scan" x="0" y="-90" width="1200" height="90" fill="url(#scanGrad)"/>
  </g>
</svg>
