<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Stack matrix. Languages: TypeScript, Python, Go, Solidity, C Sharp, GDScript. Web and API: Next.js, React, Vue, Fastify, FastAPI, Express, Prisma, Tailwind. Data: PostgreSQL, Redis, MongoDB, Qdrant, ChromaDB. Contracts: Foundry, OpenZeppelin, wagmi/viem, Uniswap V2, SPL Token-2022. Ops: Docker, GitHub Actions, Cloudflare, Oracle Cloud Always Free self-hosted 24/7. AI: LangGraph, RAG pipelines, LLM orchestration, multi-agent systems.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d0a"/>
      <stop offset="1" stop-color="#030807"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#10b981" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="frame2">
      <rect x="0" y="0" width="1200" height="400" rx="10"/>
    </clipPath>
    <style>
      .m2 { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #10b981; fill-opacity: 0.6; font-size: 14px; letter-spacing: 1px; }
      .phead { fill: #34d399; font-size: 11.5px; letter-spacing: 3.2px; }
      .pidx  { fill: #10b981; fill-opacity: 0.45; font-size: 11.5px; letter-spacing: 1px; }
      .pitem { fill: #a7f3d0; fill-opacity: 0.88; font-size: 13px; letter-spacing: 0.4px; }
      .plegend { fill: #10b981; fill-opacity: 0.42; font-size: 11px; letter-spacing: 1.6px; }
    </style>
  </defs>

  <g clip-path="url(#frame2)">
    <rect width="1200" height="400" fill="url(#bg2)"/>
    <rect width="1200" height="400" fill="url(#grid2)"/>

    <text class="m2 prompt" x="32" y="34">$ cat ~/stack.yaml</text>
    <line x1="32" y1="48" x2="1168" y2="48" stroke="#10b981" stroke-opacity="0.18"/>

    <!-- panel template: x, y, index, title, items -->
    <g>
      <rect x="32" y="68" width="368" height="132" rx="6" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.22"/>
      <text class="m2 pidx" x="48" y="92">01</text>
      <text class="m2 phead" x="82" y="92">LANGUAGES</text>
      <line x1="48" y1="102" x2="384" y2="102" stroke="#10b981" stroke-opacity="0.14"/>
      <text class="m2 pitem" x="48" y="126">TypeScript · Python · Go · Solidity</text>
      <text class="m2 pitem" x="48" y="148">C# · GDScript</text>
    </g>
    <g>
      <rect x="416" y="68" width="368" height="132" rx="6" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.22"/>
      <text class="m2 pidx" x="432" y="92">02</text>
      <text class="m2 phead" x="466" y="92">WEB · API</text>
      <line x1="432" y1="102" x2="768" y2="102" stroke="#10b981" stroke-opacity="0.14"/>
      <text class="m2 pitem" x="432" y="126">Next.js · React · Vue · Tailwind</text>
      <text class="m2 pitem" x="432" y="148">Fastify · FastAPI · Express · Prisma</text>
    </g>
    <g>
      <rect x="800" y="68" width="368" height="132" rx="6" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.22"/>
      <text class="m2 pidx" x="816" y="92">03</text>
      <text class="m2 phead" x="850" y="92">DATA</text>
      <line x1="816" y1="102" x2="1152" y2="102" stroke="#10b981" stroke-opacity="0.14"/>
      <text class="m2 pitem" x="816" y="126">PostgreSQL · Redis · MongoDB</text>
      <text class="m2 pitem" x="816" y="148">Qdrant · ChromaDB</text>
    </g>
    <g>
      <rect x="32" y="214" width="368" height="132" rx="6" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.22"/>
      <text class="m2 pidx" x="48" y="238">04</text>
      <text class="m2 phead" x="82" y="238">CONTRACTS</text>
      <line x1="48" y1="248" x2="384" y2="248" stroke="#10b981" stroke-opacity="0.14"/>
      <text class="m2 pitem" x="48" y="272">Foundry · OpenZeppelin · Uniswap V2</text>
      <text class="m2 pitem" x="48" y="294">wagmi/viem · SPL Token-2022</text>
    </g>
    <g>
      <rect x="416" y="214" width="368" height="132" rx="6" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.22"/>
      <text class="m2 pidx" x="432" y="238">05</text>
      <text class="m2 phead" x="466" y="238">OPS</text>
      <line x1="432" y1="248" x2="768" y2="248" stroke="#10b981" stroke-opacity="0.14"/>
      <text class="m2 pitem" x="432" y="272">Docker · GitHub Actions · Cloudflare</text>
      <text class="m2 pitem" x="432" y="294">Oracle Cloud — self-hosted 24/7</text>
    </g>
    <g>
      <rect x="800" y="214" width="368" height="132" rx="6" fill="#10b981" fill-opacity="0.04" stroke="#10b981" stroke-opacity="0.22"/>
      <text class="m2 pidx" x="816" y="238">06</text>
      <text class="m2 phead" x="850" y="238">AI</text>
      <line x1="816" y1="248" x2="1152" y2="248" stroke="#10b981" stroke-opacity="0.14"/>
      <text class="m2 pitem" x="816" y="272">LangGraph · RAG pipelines</text>
      <text class="m2 pitem" x="816" y="294">LLM orchestration · multi-agent</text>
    </g>

    <g stroke="#10b981" stroke-opacity="0.28" stroke-width="2" fill="none">
      <path d="M20 74V60h14"/>
      <path d="M1180 74V60h-14"/>
      <path d="M20 368v14h14"/>
      <path d="M1180 368v14h-14"/>
    </g>
    <text class="m2 plegend" x="600" y="382" text-anchor="middle">6 MODULES · 30+ TECHNOLOGIES · VERIFIED IN SHIPPED WORK</text>
  </g>
</svg>
